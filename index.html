<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101714">
  <meta name="description" content="Исследуйте пиксельный офис Linux Lab, найдите записку и выполните пять заданий за компьютерами.">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./js/game.js"></script>
  <title>Linux Lab — компьютерный класс</title>
</head>
<body>
  <main class="game" id="game">
    <canvas id="room" tabindex="0" aria-label="Офис Linux Lab. Двигайтесь на WASD или стрелках. Нажмите E рядом с компьютером или запиской."></canvas>
    <button class="interact" id="interact" type="button" hidden><kbd aria-hidden="true">E</kbd><span></span></button>
    <div class="touch-controls" aria-label="Экранное управление">
      <button type="button" data-direction="ArrowUp" aria-label="Вверх">↑</button>
      <button type="button" data-direction="ArrowLeft" aria-label="Влево">←</button>
      <button type="button" data-direction="ArrowDown" aria-label="Вниз">↓</button>
      <button type="button" data-direction="ArrowRight" aria-label="Вправо">→</button>
    </div>
    <p id="death" role="status" hidden>Вы погибли</p>
    <div id="event-notices" class="event-notices" role="log" aria-label="События в офисе"></div>
    <output id="health" class="visually-hidden" aria-label="Здоровье">100</output>
  </main>

  <dialog id="note" class="note" aria-labelledby="note-title">
    <header>
      <h2 id="note-title">Список дел</h2>
      <button type="button" id="close-note" aria-label="Закрыть записку" autofocus>×</button>
    </header>
    <ul id="tasks"></ul>
    <p class="note-hint" id="station-hint" hidden><strong id="hint-task"></strong><span id="hint-command"></span></p>
    <p class="note-controls" id="note-controls">WASD / стрелки — ходить · E — взаимодействовать<br>ЛКМ — стрелять · колёсико мыши — менять оружие во время боя</p>
  </dialog>

  <dialog id="computer" class="computer" aria-labelledby="computer-title">
    <div class="monitor">
      <header class="monitor-header">
        <h2 id="computer-title"><span class="power-light" aria-hidden="true"></span> <span id="computer-name">PC-01</span><span class="monitor-divider" aria-hidden="true">/</span><span class="monitor-label">Терминал</span></h2>
        <button type="button" class="exit" id="leave"><kbd aria-hidden="true">Esc</kbd> Встать</button>
      </header>
      <div class="monitor-bezel">
        <div class="terminal-screen" id="terminal-screen">
          <div id="terminal-output" role="log" aria-label="Вывод терминала"></div>
          <form class="terminal-form" id="terminal-form" autocomplete="off">
            <label for="command" id="prompt"></label>
            <input id="command" name="command" type="text" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Команда Linux" autofocus maxlength="160">
            <button type="submit" class="send-command" aria-label="Выполнить команду" title="Выполнить команду">↵</button>
          </form>
        </div>
      </div>
      <footer class="monitor-footer">
        <div class="terminal-actions">
          <button type="button" id="run-fastfetch"><code>fastfetch</code></button>
          <button type="button" id="clear-terminal">Очистить <kbd aria-hidden="true">Ctrl+L</kbd></button>
        </div>
        <div class="vents" aria-hidden="true"></div>
      </footer>
    </div>
  </dialog>
</body>
</html>
