<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101714">
  <meta name="description" content="Пройдитесь по пиксельному компьютерному классу и узнайте, какие Linux-системы стоят на пяти станциях.">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./js/game.js"></script>
  <title>Linux Lab — компьютерный класс</title>
</head>
<body>
  <main class="game" id="game">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><span></span></span>
        <div>
          <h1>Linux<span> Lab</span></h1>
          <p>Компьютерный класс</p>
        </div>
      </div>
      <div class="progress">
        <div class="progress-label">
          <span>Системы найдены</span>
          <output id="score" aria-live="polite">0 / 5</output>
        </div>
        <div class="progress-track" id="progress-track" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </header>

    <div class="game-layout">
      <section class="room panel" aria-labelledby="room-title">
        <div class="room-header">
          <h2 id="room-title"><span class="room-icon" aria-hidden="true"></span> План класса</h2>
          <span class="room-legend"><i aria-hidden="true"></i> Вы</span>
        </div>
        <canvas id="room" width="360" height="224" tabindex="0" aria-label="Пиксельная карта класса. Двигайтесь с помощью WASD или стрелок. Нажмите E рядом с компьютером."></canvas>
        <div class="room-footer">
          <p><strong id="interaction-title">Подойдите к компьютеру</strong><span id="interaction-detail">Введите fastfetch, чтобы узнать, какая система установлена.</span></p>
          <button type="button" class="interact" id="interact" disabled><kbd aria-hidden="true">E</kbd> Сесть за ПК</button>
        </div>
        <div class="touch-controls" aria-label="Экранное управление">
          <button type="button" data-direction="ArrowUp" aria-label="Вверх">↑</button>
          <button type="button" data-direction="ArrowLeft" aria-label="Влево">←</button>
          <button type="button" data-direction="ArrowDown" aria-label="Вниз">↓</button>
          <button type="button" data-direction="ArrowRight" aria-label="Вправо">→</button>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel stations" aria-labelledby="station-title">
          <h2 id="station-title"><span class="station-icon" aria-hidden="true"></span> Станции</h2>
          <ul id="station-list"></ul>
        </section>
        <section class="panel controls" aria-labelledby="control-title">
          <h2 id="control-title"><span class="keyboard-icon" aria-hidden="true"></span> Управление</h2>
          <ul>
            <li><span>Двигаться</span><span class="key-group"><kbd>WASD</kbd><kbd aria-label="Стрелки">↑↓←→</kbd></span></li>
            <li><span>Сесть за ПК</span><kbd>E</kbd></li>
            <li><span>Встать из-за ПК</span><kbd>Esc</kbd></li>
          </ul>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="computer" class="computer" aria-labelledby="computer-title">
    <div class="monitor">
      <header class="monitor-header">
        <h2 id="computer-title"><span class="power-light" aria-hidden="true"></span> <span id="computer-name">PC-01</span><span class="monitor-divider" aria-hidden="true">/</span><span class="monitor-label">Терминал</span></h2>
        <button type="button" class="exit" id="leave"><kbd aria-hidden="true">Esc</kbd> Встать</button>
      </header>
      <div class="monitor-bezel">
        <div class="terminal-screen" id="terminal-screen">
          <div id="terminal-output" role="log" aria-label="Вывод терминала"></div>
          <form class="terminal-form" id="terminal-form" autocomplete="off">
            <label for="command" id="prompt"></label>
            <input id="command" name="command" type="text" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Команда Linux" autofocus maxlength="160">
            <button type="submit" class="send-command" aria-label="Выполнить команду" title="Выполнить команду">↵</button>
          </form>
        </div>
      </div>
      <footer class="monitor-footer">
        <div class="terminal-actions">
          <button type="button" id="run-fastfetch"><code>fastfetch</code></button>
          <button type="button" id="clear-terminal">Очистить <kbd aria-hidden="true">Ctrl+L</kbd></button>
        </div>
        <div class="vents" aria-hidden="true"></div>
      </footer>
    </div>
  </dialog>
</body>
</html>
